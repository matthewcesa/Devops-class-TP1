services:
  backend:
    build: ./web
    networks:
      - app-network
    depends_on:
      - database

  database:
    build: ./database
    networks:
      - app-network

  httpd:
    build: ./network
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  db-data: {}