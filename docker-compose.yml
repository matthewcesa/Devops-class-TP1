services:
  backend: # se connecte avec la db a travers backend network
            #se connecte avec le front avec app netowrk
    build: ./web
    networks:
      - app-network
      - backend-network
    depends_on:
      - database

  database: #se connecte qu'avec le back end a travers backend-network
    build: ./database
    networks:
      - backend-network

  httpd: #se connecte qu'avec le backend a travers app-network
    build: ./network
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend

networks: #permet de communiquer, isoler la db du front (les conteneurs ne doivent pas tous se comuniquer entre eux)
  app-network:
  backend-network: 

  

volumes:
  db-data: {}